steps:
  # ─── BUILD PORTAL-WEB ──────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-portal'
    args: [
      'build', 
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/portal-web:${_IMAGE_TAG}',
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/portal-web:latest',
      '-f', 'Dockerfile.portal', 
      '.'
    ]

  # ─── BUILD ADMIN-PANEL ─────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-admin'
    args: [
      'build', 
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin-panel:${_IMAGE_TAG}',
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin-panel:latest',
      '-f', 'Dockerfile.admin', 
      '.'
    ]

  # ─── PUSH IMAGES ───────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/portal-web']
    waitFor: ['build-portal']
  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images-admin'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin-panel']
    waitFor: ['build-admin']

  # ─── DEPLOY PORTAL-WEB ─────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-portal'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'portal-web'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/portal-web:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '${_INSTANCE_CONNECTION_NAME}'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest'
      - '--update-env-vars'
      - 'NEXTAUTH_SECRET=${_NEXTAUTH_SECRET},AUTH_SECRET=${_NEXTAUTH_SECRET},AUTH_TRUST_HOST=true,AUTH_URL=https://portal-web-669857254064.southamerica-east1.run.app,NEXTAUTH_URL=https://portal-web-669857254064.southamerica-east1.run.app'
    waitFor: ['push-images']

  # ─── DEPLOY ADMIN-PANEL ────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-admin'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'admin-panel'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin-panel:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '${_INSTANCE_CONNECTION_NAME}'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest'
      - '--update-env-vars'
      - 'NEXTAUTH_SECRET=${_NEXTAUTH_SECRET},AUTH_SECRET=${_NEXTAUTH_SECRET},AUTH_TRUST_HOST=true,AUTH_URL=https://admin-panel-669857254064.southamerica-east1.run.app,NEXTAUTH_URL=https://admin-panel-669857254064.southamerica-east1.run.app'
    waitFor: ['push-images-admin']

substitutions:
  _REGION: 'southamerica-east1'
  _AR_REPO: 'autouy-repo'
  _INSTANCE_CONNECTION_NAME: 'autouy:southamerica-east1:postgres-cubik-anti'
  _NEXTAUTH_SECRET: 'tYlr5GwelMBA/AQIg2JayDFBhI/hLHrs5ASjfTUwB98='
  _IMAGE_TAG: 'latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

